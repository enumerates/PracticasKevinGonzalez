<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro Iphone</title>
</head>
<body>
    <h1>Registro para ganar un Iphone</h1>
<form>
    <label for="nombre">Nombre:</label>
    <input type="text" id="nombre" name="nombre">
    <label for="contraseña">Contraseña</label>
    <input type="text" name="password" id="contraseña">
    <p>¿Vives en San Salvador?</p>
    <input type="radio" name="Recidencia" id="si">
    <label for="si">Si</label>
    <input type="radio" id="no" name="Recidencia">
    <label for="no">No</label> <br> <br>
    <label for="Edad">Edad</label>
    <input type="number" id="Edad" name="Edad"><br>
    <label for="Correo">Correo electrónico</label> <br>
<input type="email" name="correo" id="correo"> <br> <br>
<input type="submit" value="Registrarse">
<input type="reset" value="Borrar">
</form>


</body>
</html>
