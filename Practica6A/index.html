<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Formulario de Reserva de Viaje</h1>
     <form> <!-- Sección Datos Personales -->
        
        <fieldset> <legend>Datos Personales</legend>
            
            <!-- Nombre --> <label for="nombre">Nombre:</label>
             
            <input type="text" id="nombre" name="nombre" required> <br><br>
            
            <!-- Correo electrónico --> <label for="correo">Correo electrónico:</label> 
             
            <input type="email" id="correo" name="correo" placeholder="example@email.com" required> <br><br>
            
            <!-- Teléfono --> <label for="telefono">Teléfono:</label> 
             
            <input type="tel" id="telefono" name="telefono" required> <br><br> 
        
        </fieldset> <!-- Sección Datos del Viaje --> 
        
        <fieldset> <legend>Datos del Viaje</legend> 
            
            <!-- Número de acompañantes --> 
             
            <label for="acompanantes">Número de acompañantes:</label>
              <input type="number" id="acompanantes" name="acompanantes" min="1" max="5" step="1" required>
              
              <br><br> <!-- Lugar de origen --> 
              
              <label for="origen">Lugar de origen:</label> 
              
              <input type="text" id="origen" name="origen" value="San Salvador" readonly> 
              
              <br><br> <!-- Lugar de destino --> 
              
              <label for="destino">Lugar de destino:</label> 
              
              <select id="destino" name="destino" required> 
                
            <option value="">Seleccione un destino</option> 
            
            <option value="lauterbrunnen">Lauterbrunnen</option> 
            
            <option value="florencia">Florencia</option> 
            
            <option value="barcelona">Barcelona</option> 
            
            <option value="venecia">Venecia</option> 
        </select> <br><br> 
        <!-- Fecha de salida --> <label for="salida">Fecha de salida:</label>
        <input type="date" id="salida" name="salida" required> <br><br> 
        
        <!-- Fecha de regreso --> <label for="regreso">Fecha de regreso:</label> 
         
        <input type="date" id="regreso" name="regreso" required> <br><br> 
        
        </fieldset> <!-- Botón de envío --> <input type="submit" value="Reservar"> 
    
    </form>
</body>
</html>
